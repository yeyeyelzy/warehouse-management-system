<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('销售出库')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
    <h2>销售出库（FIFO / LIFO 成本核算）</h2>
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <div th:if="${warning}" class="alert warning" th:text="${warning}"></div>
    <p style="color:#888;font-size:13px;">底层调用存储过程 sp_outbound_cost（biz_type=SALE），按货品计价方式自动核算出库成本；审核通过后由触发器扣减库存。</p>
    <form th:action="@{/biz/outbound}" method="post" class="grid">
        <label>出库仓库</label>
        <select name="warehouseId" required>
            <option value="">请选择仓库</option>
            <option th:each="w : ${warehouses}" th:value="${w.warehouseId}" th:text="${w.warehouseName}"></option>
        </select>
        <label>货品</label>
        <select name="goodsId" required>
            <option value="">请选择货品</option>
            <option th:each="g : ${goodsList}" th:value="${g.goodsId}" th:text="${g.goodsName + '(' + g.costMethod + ')'}"></option>
        </select>
        <label>出库数量</label><input type="number" step="0.01" name="quantity" required>
        <label></label><button type="submit">确认出库</button>
    </form>
</div>
</body>
</html>

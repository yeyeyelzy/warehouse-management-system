<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('仓库调拨')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
    <h2>仓库调拨</h2>
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <div th:if="${warning}" class="alert warning" th:text="${warning}"></div>
    <p style="color:#888;font-size:13px;">底层调用存储过程 sp_transfer（支持 JSON 多货品批量明细），源仓扣减、目标仓增加，同一事务内整体回滚。</p>
    <form th:action="@{/biz/transfer}" method="post" class="grid">
        <label>调出仓库</label>
        <select name="fromWarehouseId" required>
            <option value="">请选择仓库</option>
            <option th:each="w : ${warehouses}" th:value="${w.warehouseId}" th:text="${w.warehouseName}"></option>
        </select>
        <label>调入仓库</label>
        <select name="toWarehouseId" required>
            <option value="">请选择仓库</option>
            <option th:each="w : ${warehouses}" th:value="${w.warehouseId}" th:text="${w.warehouseName}"></option>
        </select>
        <label>货品</label>
        <select name="goodsId" required>
            <option value="">请选择货品</option>
            <option th:each="g : ${goodsList}" th:value="${g.goodsId}" th:text="${g.goodsName}"></option>
        </select>
        <label>调拨数量</label><input type="number" step="0.01" name="quantity" required>
        <label></label><button type="submit">确认调拨</button>
    </form>
</div>
</body>
</html>

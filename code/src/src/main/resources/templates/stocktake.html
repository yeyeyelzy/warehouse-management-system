<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('库存盘点')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
    <h2>库存盘点（盘盈 / 盘亏）</h2>
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <p style="color:#888;font-size:13px;">底层调用存储过程 sp_stocktake，自动比对账面与实盘、生成盘点记录并修正库存，事务异常自动回滚。</p>
    <form th:action="@{/biz/stocktake}" method="post" class="grid">
        <label>盘点仓库</label>
        <select name="warehouseId" required>
            <option value="">请选择仓库</option>
            <option th:each="w : ${warehouses}" th:value="${w.warehouseId}" th:text="${w.warehouseName}"></option>
        </select>
        <label>货品</label>
        <select name="goodsId" required>
            <option value="">请选择货品</option>
            <option th:each="g : ${goodsList}" th:value="${g.goodsId}" th:text="${g.goodsName}"></option>
        </select>
        <label>实盘数量</label><input type="number" step="0.01" name="actualQuantity" required>
        <label></label><button type="submit">提交盘点</button>
    </form>
</div>
</body>
</html>
